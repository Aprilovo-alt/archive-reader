<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>碎纸诗 · Paper Poetry</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#242321;color:#1b1a18;font-family:Georgia,"Noto Serif SC",serif;overflow:hidden}button,input,textarea{font:inherit}.app{height:100vh;display:flex;flex-direction:column}.bar{height:54px;flex:none;background:#d8d2c5;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:8px 12px}.brand{font:11px monospace;letter-spacing:.12em}.actions{display:flex;gap:6px}.actions button{border:1px solid #333;background:#eee8dc;padding:7px 10px;font:11px monospace}.actions .dark{background:#171615;color:#fff}.main{min-height:0;flex:1;display:grid;grid-template-columns:270px 1fr 220px}.side{background:#d8d2c5;padding:14px;overflow:auto}.left{border-right:1px solid #222}.right{border-left:1px solid #222}.label{font:10px monospace;letter-spacing:.12em;opacity:.65;margin:8px 0}.search{display:flex;border:1px solid #777;background:#eee8dc}.search input{width:100%;border:0;outline:0;background:transparent;padding:8px;font-size:13px}.search button{border:0;background:#222;color:#fff;width:38px}.cats{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.cats button,.mini{border:1px solid #999;background:#e8e2d6;padding:5px 7px;font-size:10px}.cats .on{background:#222;color:#fff}.clips{display:grid;gap:8px}.clip{background:#eee8dc;border:1px solid #aaa;padding:10px;box-shadow:2px 3px 0 #999;cursor:pointer;touch-action:manipulation}.clip small{display:block;font:9px monospace;opacity:.5;margin-bottom:5px}.clip:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #999}.hint{font:10px monospace;line-height:1.6;opacity:.55}.stage{position:relative;overflow:hidden;background:#292825;background-image:radial-gradient(#555 1px,transparent 1px);background-size:20px 20px}.board{position:absolute;inset:5% 6%;background:#eee9df;box-shadow:0 18px 50px #0008;overflow:hidden}.board:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;background-image:radial-gradient(#777 0.6px,transparent .8px);background-size:7px 7px}.piece{position:absolute;z-index:5;touch-action:none;cursor:grab;user-select:none;filter:drop-shadow(3px 5px 3px #0003)}.paper{position:relative;padding:14px 16px;line-height:1.45;min-width:110px;max-width:300px;overflow:visible}.piece .edge{position:absolute;inset:0;pointer-events:none}.piece.selected{filter:drop-shadow(4px 7px 5px #0005)}textarea{width:100%;height:100px;resize:none;border:1px solid #999;background:#eee8dc;padding:9px;outline:0}.add{width:100%;margin-top:6px;padding:8px;border:1px solid #222;background:#222;color:#fff}.sw{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.sw i{width:28px;height:28px;border:1px solid #777}.control{margin:12px 0}.control label{display:flex;justify-content:space-between;font:10px monospace}.control input{width:100%}@media(max-width:800px){.main{display:block}.left,.right{display:none}.board{inset:4% 3%}.bar{height:50px}.stage{height:calc(100vh - 50px)}}
</style>
<div class="app"><header class="bar"><div class="brand">碎纸诗 / PAPER POETRY</div><div class="actions"><button id="clear">清空</button><button id="scatter">散落</button><button id="save" class="dark">保存 PNG</button></div></header>
<div class="main"><aside class="side left"><div class="label">COLLECT / 搜集</div><div class="search"><input id="q" placeholder="搜索文字"><button id="search">⌕</button></div><div class="cats"><button class="on" data-c="all">全部</button><button data-c="news">报纸</button><button data-c="mag">杂志</button><button data-c="book">旧书</button></div><div id="clips" class="clips"></div><p class="hint">点击一段文字，把它从纸面上撕下来。撕下后可拖动、旋转、叠放。</p></aside>
<main class="stage"><div id="board" class="board"></div></main>
<aside class="side right"><div class="label">WRITE / 自己写</div><textarea id="txt" placeholder="写一句话……"></textarea><button class="add" id="add">撕下来</button><div class="label">PAPER / 纸张</div><div class="sw"><i data-c="#eee9df" style="background:#eee9df"></i><i data-c="#d8c6a5" style="background:#d8c6a5"></i><i data-c="#e6d8cf" style="background:#e6d8cf"></i><i data-c="#d0d0c8" style="background:#d0d0c8"></i></div><div class="control"><label>撕裂 <span id="av">16</span></label><input id="amp" type="range" min="5" max="30" value="16"></div><div class="control"><label>旋转 <span id="rv">8°</span></label><input id="rot" type="range" min="0" max="20" value="8"></div><div class="control"><label>字号 <span id="sv">18</span></label><input id="size" type="range" min="11" max="34" value="18"></div></aside></div></div>
<script>
const data=[["news","晨间的风从城市另一侧吹来。","THE MORNING EDITION"],["news","没有人知道雨会在什么时候停止。","CITY / WEATHER"],["news","我们把沉默留在昨天。","DAILY RECORD"],["news","有人在凌晨三点看见灯还亮着。","NIGHT REPORT"],["mag","身体记得所有没有说出口的话。","CULTURE"],["mag","她把月亮剪下来，贴在窗边。","LIFE & STYLE"],["mag","世界正在缓慢地改变它的形状。","THE OBSERVER"],["book","后来我才知道，那不是告别。","ARCHIVE"],["book","他站在那里，像一封没有寄出的信。","OLD TEXT"],["book","我们经过彼此，却没有停下来。","FRAGMENT 08"]];
const clips=document.querySelector("#clips"),board=document.querySelector("#board");let cat="all",paper="#eee9df";
function render(){let q=document.querySelector("#q").value.trim().toLowerCase();clips.innerHTML="";data.filter(x=>(cat==="all"||x[0]===cat)&&(!q||x[1].includes(q))).forEach(x=>{let d=document.createElement("div");d.className="clip";d.innerHTML="<small>"+x[2]+"</small>"+x[1];d.addEventListener("click",()=>piece(x[1]));clips.appendChild(d)})}
document.querySelectorAll(".cats button").forEach(b=>b.onclick=()=>{document.querySelector(".cats .on").classList.remove("on");b.classList.add("on");cat=b.dataset.c;render()});document.querySelector("#search").onclick=render;document.querySelector("#q").oninput=render;render();
function tear(w,h,a){let n=16,s="M 0 "+(a+Math.random()*a);for(let i=1;i<=n;i++){let x=w*i/n,y=a+Math.random()*a*2;s+=" Q "+(x-w/n/2)+" "+(Math.random()*a*2)+" "+x+" "+y}return s+" L "+w+" "+h+" L 0 "+h+" Z"}
function piece(text){let el=document.createElement("div"),p=document.createElement("div"),a=+document.querySelector("#amp").value,sz=+document.querySelector("#size").value,r=+document.querySelector("#rot").value;el.className="piece";p.className="paper";p.textContent=text;p.style.cssText="background:"+paper+";font-size:"+sz+"px";el.appendChild(p);board.appendChild(el);let w=Math.min(300,Math.max(130,text.length*sz*.52+34));p.style.width=w+"px";let h=p.offsetHeight;let svg=document.createElementNS("http://www.w3.org/2000/svg","svg"),path=document.createElementNS("http://www.w3.org/2000/svg","path"),clip=document.createElementNS("http://www.w3.org/2000/svg","clipPath"),id="c"+Math.random().toString(36).slice(2);svg.setAttribute("width",w);svg.setAttribute("height",h);svg.classList.add("edge");clip.id=id;clip.setAttribute("clipPathUnits","userSpaceOnUse");path.setAttribute("d",tear(w,h,a));clip.appendChild(path);svg.appendChild(clip);p.style.clipPath="url(#"+id+")";p.appendChild(svg);el.style.left=(30+Math.random()*Math.max(10,board.clientWidth-w-60))+"px";el.style.top=(30+Math.random()*Math.max(10,board.clientHeight-h-60))+"px";el.style.transform="rotate("+(Math.random()*2*r-r)+"deg)";drag(el)}
function drag(el){let sx,sy,l,t,down=false;el.addEventListener("pointerdown",e=>{down=true;el.classList.add("selected");sx=e.clientX;sy=e.clientY;l=el.offsetLeft;t=el.offsetTop;el.setPointerCapture(e.pointerId)});el.addEventListener("pointermove",e=>{if(!down)return;el.style.left=l+e.clientX-sx+"px";el.style.top=t+e.clientY-sy+"px"});el.addEventListener("pointerup",e=>{down=false;try{el.releasePointerCapture(e.pointerId)}catch(_){}});el.addEventListener("dblclick",()=>el.remove())}
document.querySelector("#add").onclick=()=>{let x=document.querySelector("#txt");if(x.value.trim()){piece(x.value.trim());x.value=""}};document.querySelectorAll(".sw i").forEach(x=>x.onclick=()=>paper=x.dataset.c);
document.querySelector("#amp").oninput=e=>document.querySelector("#av").textContent=e.target.value;document.querySelector("#rot").oninput=e=>document.querySelector("#rv").textContent=e.target.value+"°";document.querySelector("#size").oninput=e=>document.querySelector("#sv").textContent=e.target.value;
document.querySelector("#clear").onclick=()=>document.querySelectorAll(".piece").forEach(x=>x.remove());document.querySelector("#scatter").onclick=()=>document.querySelectorAll(".piece").forEach(x=>{x.style.left=Math.random()*(board.clientWidth-x.offsetWidth)+"px";x.style.top=Math.random()*(board.clientHeight-x.offsetHeight)+"px";x.style.transform="rotate("+(Math.random()*24-12)+"deg)"});
document.querySelector("#save").onclick=()=>{alert("拼贴已经完成。导出 PNG 功能会在下一版接入更稳定的截图引擎。")};
</script>
